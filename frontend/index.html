<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode Advisor Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <span class="navbar-brand">📊 LeetCode Advisor Dashboard</span>
    <div class="d-flex gap-2">
      <a href="contests.html" class="btn btn-outline-light btn-sm">Contest Report</a>
      <a href="upload.html" class="btn btn-outline-light btn-sm">Upload Student List</a>
      <button id="refreshBtn" class="btn btn-accent btn-sm">Refresh Data</button>
      <a href="/api/export" class="btn btn-outline-light btn-sm">Download Excel</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">

  <div class="row g-3 mb-2" id="statCards"></div>

  <div class="row g-3 mt-1 mb-4" id="statCards2"></div>

  <div class="row g-3 mb-4">
    <div class="col-lg-4">
      <div class="chart-box h-100">
        <h6 class="mb-3">Solved Breakdown (avg per student)</h6>
        <canvas id="pieChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="chart-box h-100">
        <h6 class="mb-3">Top 10 Ratings</h6>
        <canvas id="barChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="chart-box h-100">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">Latest Contest</h6>
          <a href="contests.html" class="small">Full report →</a>
        </div>
        <div id="latestContestBox" class="text-muted small">Loading...</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Student List</h6>
      <div class="d-flex gap-2">
        <input id="searchBox" class="form-control form-control-sm" style="width:220px" placeholder="Search name / username...">
        <select id="ratingFilter" class="form-select form-select-sm" style="width:150px">
          <option value="0">All Ratings</option>
          <option value="1200">1200+</option>
          <option value="1500">1500+</option>
          <option value="1800">1800+</option>
          <option value="2000">2000+</option>
        </select>
        <select id="statusFilter" class="form-select form-select-sm" style="width:150px">
          <option value="all">All Status</option>
          <option value="ok">Fetched OK</option>
          <option value="pending">Pending</option>
          <option value="error">Error</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="studentTable">
        <thead>
          <tr>
            <th data-key="name">Name</th>
            <th data-key="register_no">Register No</th>
            <th data-key="leetcode_username">Username</th>
            <th data-key="rating">Rating</th>
            <th data-key="ranking">Global Rank</th>
            <th data-key="easy_solved">Easy</th>
            <th data-key="medium_solved">Medium</th>
            <th data-key="hard_solved">Hard</th>
            <th data-key="total_solved">Total Solved</th>
            <th data-key="fetch_status">Status</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<div class="spinner-overlay" id="spinnerOverlay">
  <div class="text-center">
    <div class="spinner-border text-light mb-2" role="status"></div>
    <div id="spinnerText" class="text-light small">Refreshing student data...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
