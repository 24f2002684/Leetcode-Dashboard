<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile — LeetCode Advisor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <span class="navbar-brand">📊 LeetCode Advisor Dashboard</span>
    <a href="index.html" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width:960px">
  <div id="profileHeader" class="panel mb-4"></div>

  <div class="row g-3 mb-4">
    <div class="col-lg-6">
      <div class="chart-box h-100">
        <h6 class="mb-3">Solved Breakdown</h6>
        <canvas id="pieChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="chart-box h-100">
        <h6 class="mb-3">Contest Rating Growth</h6>
        <canvas id="lineChart" height="220"></canvas>
      </div>
    </div>
  </div>

  <div class="panel">
    <h6 class="mb-3">Contest History</h6>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>Contest</th><th>Rank</th><th>Solved</th><th>Rating</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/student.js"></script>
</body>
</html>
