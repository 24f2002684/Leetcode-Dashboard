<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Student List — LeetCode Advisor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <span class="navbar-brand">📊 LeetCode Advisor Dashboard</span>
    <div class="d-flex gap-2">
      <a href="contests.html" class="btn btn-outline-light btn-sm">Contest Report</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
    </div>
  </div>
</nav>

<div class="container py-5" style="max-width:640px">
  <div class="panel">
    <h5 class="mb-1">Upload Student List</h5>
    <p class="text-muted small mb-4">This only needs to be done once. Re-uploading updates existing students (matched by Register No) and adds any new ones.</p>

    <div class="mb-3">
      <label class="form-label small text-muted">Excel file must have these column headers (any order):</label>
      <div class="table-responsive">
        <table class="table table-sm table-bordered">
          <thead><tr><th>Student Name</th><th>Register No</th><th>Leetcode ID</th></tr></thead>
          <tbody><tr><td>Rahul</td><td>23CS001</td><td>rahul123</td></tr>
          <tr><td>Arun</td><td>23CS002</td><td>arun_vit</td></tr></tbody>
        </table>
      </div>
    </div>

    <input type="file" id="fileInput" accept=".xlsx,.xls" class="form-control mb-3">
    <button id="uploadBtn" class="btn btn-accent w-100">Upload</button>

    <div id="resultBox" class="mt-3"></div>
  </div>
</div>

<script>
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('fileInput');
  const resultBox = document.getElementById('resultBox');
  if (!fileInput.files.length) {
    resultBox.innerHTML = '<div class="alert alert-warning py-2">Please choose a file first.</div>';
    return;
  }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);

  resultBox.innerHTML = '<div class="text-muted small">Uploading...</div>';
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    resultBox.innerHTML = `<div class="alert alert-success py-2">${data.message} (${data.count} students). <a href="index.html">Go to dashboard →</a></div>`;
  } catch (err) {
    resultBox.innerHTML = `<div class="alert alert-danger py-2">${err.message}</div>`;
  }
});
</script>
</body>
</html>
