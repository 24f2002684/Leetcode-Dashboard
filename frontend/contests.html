<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contest Report — LeetCode Advisor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <span class="navbar-brand">📊 LeetCode Advisor Dashboard</span>
    <div class="d-flex gap-2">
      <a href="index.html" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
      <a href="upload.html" class="btn btn-outline-light btn-sm">Upload Student List</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">

  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
    <h5 class="mb-0">Weekly Contest Report</h5>
    <select id="contestSelect" class="form-select form-select-sm" style="width:280px"></select>
  </div>

  <div class="row g-3 mb-4" id="contestCards"></div>

  <div class="panel mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Participants</h6>
      <input id="searchBox" class="form-control form-control-sm" style="width:220px" placeholder="Search name / username...">
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Register No</th>
            <th>Username</th>
            <th>Solved</th>
            <th>Finish Time</th>
            <th>Rating</th>
            <th>Rating Change</th>
          </tr>
        </thead>
        <tbody id="participantsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h6 class="mb-3">Did Not Attend</h6>
    <div id="absenteesBox" class="d-flex flex-wrap gap-2"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/contests.js"></script>
</body>
</html>
